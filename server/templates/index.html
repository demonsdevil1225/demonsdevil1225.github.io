<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bubbly &amp; Ammu 💙</title>
<link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@400;700&family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300&display=swap" rel="stylesheet">
<style>
:root{ --bubbly:#ff4d6d; --ammu:#4a9eff; --violet:#c084fc; --gold:#ffd97d; }
*{margin:0;padding:0;box-sizing:border-box;}
html,body{width:100%;height:100%;}
body{
  background:radial-gradient(ellipse at 50% 0%,#001535 0%,#000a1e 40%,#00050f 100%);
  font-family:'Cormorant Garamond',serif;color:#e8f4ff;
  min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2rem;
}
.title{font-family:'Dancing Script',cursive;font-size:clamp(2rem,7vw,3.2rem);
  background:linear-gradient(135deg,#f4a0b0,#a8d4ff);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;
  filter:drop-shadow(0 0 16px rgba(244,160,176,.4));text-align:center;}
.cards{display:flex;gap:1.6rem;flex-wrap:wrap;justify-content:center;padding:0 1rem;}
.card{
  width:220px;padding:2rem 1.2rem;border-radius:22px;text-decoration:none;color:inherit;
  background:rgba(0,15,45,0.45);border:1px solid rgba(255,255,255,0.1);
  display:flex;flex-direction:column;align-items:center;gap:.6rem;transition:all .3s;
}
.card:hover{transform:translateY(-6px);border-color:var(--violet);box-shadow:0 0 30px rgba(192,132,252,.3);}
.card-emoji{font-size:2.6rem;}
.card-name{font-family:'Dancing Script',cursive;font-size:1.3rem;}
.card-desc{font-size:.8rem;font-style:italic;color:rgba(255,255,255,.4);text-align:center;}
</style>
</head>
<body>
  <div class="title">Bubbly &amp; Ammu 💙</div>
  <div class="cards">
    <a class="card" href="/rps">
      <div class="card-emoji">🪨📄✂️</div>
      <div class="card-name">Stone, Paper, Scissors</div>
      <div class="card-desc">a never-ending little duel for two</div>
    </a>
    <a class="card" href="/maze">
      <div class="card-emoji">💙</div>
      <div class="card-name">Find Each Other</div>
      <div class="card-desc">a maze for two hearts</div>
    </a>
    <a class="card" href="/sudoku">
      <div class="card-emoji">🔢</div>
      <div class="card-name">Sudoku</div>
      <div class="card-desc">together in every cell</div>
    </a>
  </div>
</body>
</html>
