<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bubbly & Ammu 💙</title>
<link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@400;700&family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300&display=swap" rel="stylesheet">
<style>
:root{--bubbly:#ff4d6d;--ammu:#4a9eff;--gold:#ffd97d;--violet:#c084fc;}
*{margin:0;padding:0;box-sizing:border-box;}
html,body{width:100%;height:100%;overflow:hidden;}
body{
  background:radial-gradient(ellipse at 50% 0%,#001535 0%,#000a1e 40%,#00050f 100%);
  font-family:'Cormorant Garamond',serif;color:#e8f4ff;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  min-height:100vh;user-select:none;
}
#starCanvas{position:fixed;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:1;}
.aurora{position:fixed;top:0;left:0;right:0;height:60vh;pointer-events:none;z-index:1;overflow:hidden;opacity:0.12;}
.aurora-band{position:absolute;left:-20%;right:-20%;height:200px;border-radius:50%;filter:blur(60px);animation:auroraDrift 12s ease-in-out infinite alternate;}
.aurora-band:nth-child(1){top:5%;background:rgba(50,120,255,0.6);}
.aurora-band:nth-child(2){top:10%;background:rgba(192,132,252,0.45);animation-delay:-4s;}
.aurora-band:nth-child(3){top:2%;background:rgba(244,160,176,0.3);animation-delay:-8s;}
@keyframes auroraDrift{0%{transform:translateX(-8%) scaleY(1)}50%{transform:translateX(5%) scaleY(1.3)}100%{transform:translateX(-3%) scaleY(0.8)}}

.hub{position:relative;z-index:10;display:flex;flex-direction:column;align-items:center;gap:1.8rem;padding:1rem;}
.hub-title{font-family:'Dancing Script',cursive;font-size:clamp(2rem,6vw,3.2rem);
  background:linear-gradient(135deg,#f4a0b0,#c084fc,#a8d4ff);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;
  filter:drop-shadow(0 0 20px rgba(192,132,252,.5));text-align:center;line-height:1.15;}
.hub-sub{font-family:'Cormorant Garamond',serif;font-style:italic;font-size:clamp(.85rem,2vw,1.1rem);
  color:rgba(200,220,255,.45);text-align:center;margin-top:-.8rem;}

.games{display:flex;gap:1.4rem;flex-wrap:wrap;justify-content:center;}
.game-card{
  width:200px;padding:2rem 1.2rem;border-radius:22px;cursor:pointer;text-decoration:none;
  background:rgba(0,15,45,0.45);border:1px solid rgba(255,255,255,0.1);
  display:flex;flex-direction:column;align-items:center;gap:.7rem;
  transition:all .3s;backdrop-filter:blur(10px);color:#e8f4ff;
}
.game-card:hover{transform:translateY(-8px);border-color:rgba(192,132,252,0.5);box-shadow:0 0 35px rgba(192,132,252,.3);}
.game-icon{font-size:3rem;filter:drop-shadow(0 0 14px rgba(255,255,255,.2));}
.game-name{font-family:'Dancing Script',cursive;font-size:1.4rem;color:#fff;}
.game-desc{font-size:.78rem;font-style:italic;color:rgba(255,255,255,.35);text-align:center;line-height:1.3;}
.game-tag{font-size:.65rem;text-transform:uppercase;letter-spacing:.08rem;color:rgba(255,217,125,.5);
  border:1px solid rgba(255,217,125,.2);border-radius:50px;padding:.15rem .6rem;margin-top:.2rem;}

.credits{font-family:'Cormorant Garamond',serif;font-style:italic;font-size:.75rem;
  color:rgba(200,220,255,.25);text-align:center;margin-top:1rem;}
</style>
</head>
<body>

<div class="aurora"><div class="aurora-band"></div><div class="aurora-band"></div><div class="aurora-band"></div></div>
<canvas id="starCanvas"></canvas>

<div class="hub">
  <div class="hub-title">Bubbly & Ammu 💙</div>
  <div class="hub-sub">choose a game to play together</div>

  <div class="games">
    <a href="/rps" class="game-card">
      <div class="game-icon">✊</div>
      <div class="game-name">Stone Paper Scissors</div>
      <div class="game-desc">battle with lives, reveal cards, roll the dice</div>
      <div class="game-tag">2 players</div>
    </a>
    <a href="/maze" class="game-card">
      <div class="game-icon">🏰</div>
      <div class="game-name">Find Each Other</div>
      <div class="game-desc">navigate the maze, find your partner</div>
      <div class="game-tag">2 players</div>
    </a>
    <a href="/sudoku" class="game-card">
      <div class="game-icon">🔢</div>
      <div class="game-name">Sudoku</div>
      <div class="game-desc">solve the puzzle together, cell by cell</div>
      <div class="game-tag">2 players</div>
    </a>
  </div>

  <div class="credits">made with love for Bubbly & Ammu</div>
</div>

<script>
(function(){
  const c=document.getElementById('starCanvas'),ctx=c.getContext('2d');
  let W,H,stars=[];
  function resize(){W=c.width=window.innerWidth;H=c.height=window.innerHeight;stars=[];
    for(let i=0;i<180;i++)stars.push({x:Math.random()*W,y:Math.random()*H,r:Math.random()*1.5+.2,a:Math.random(),da:Math.random()*.006+.002,col:Math.random()<.5?'180,220,255':'255,255,255'});}
  resize();window.addEventListener('resize',resize);
  (function draw(){ctx.clearRect(0,0,W,H);stars.forEach(s=>{s.a+=s.da;if(s.a>1||s.a<0)s.da*=-1;ctx.beginPath();ctx.arc(s.x,s.y,s.r,0,Math.PI*2);ctx.fillStyle=`rgba(${s.col},${s.a*.8})`;ctx.fill();});requestAnimationFrame(draw);})();
})();
</script>
</body>
</html>
